name: sft_gemma3_4b_v2
model_family: gemma3
base_model_config: configs/models/gemma3_4b.yaml
seed: 2026
train_data: data/sft/train.jsonl
val_data: data/sft/val.jsonl
output_dir: artifacts/runs/sft_gemma3_4b_v2
max_seq_length: 2048
# Gemma3-4B has vision capability; this pipeline freezes vision layers.
long_example_policy: drop
min_fit_ratio: 0.50
medical_answers_approved: false
qlora:
  bits: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
trainer:
  learning_rate: 0.0001
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  logging_steps: 1
  bf16: true
