name: sft_qwen3_8b_v2
model_family: qwen3
base_model_config: configs/models/qwen3_8b.yaml
seed: 2026
train_data: data/sft/train.jsonl
val_data: data/sft/val.jsonl
output_dir: artifacts/runs/sft_qwen3_8b_v2
max_seq_length: 2048
# Never truncate answers silently. 'drop' is documented in audit_preflight.json.
long_example_policy: drop
min_fit_ratio: 0.50
medical_answers_approved: false
qlora:
  bits: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
trainer:
  learning_rate: 0.00005
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  logging_steps: 1
  bf16: true
